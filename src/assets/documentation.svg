<!-- Documentation icon - Simple SVG -->
<svg
  width="200"
  height="200"
  viewBox="0 0 200 200"
  xmlns="http://www.w3.org/2000/svg"
>
  <defs>
    <linearGradient id="docGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Book base -->
  <rect
    x="40"
    y="40"
    width="120"
    height="140"
    rx="8"
    fill="url(#docGradient)"
  />
  <rect x="50" y="50" width="100" height="120" rx="4" fill="white" />
  
  <!-- Pages -->
  <rect x="60" y="70" width="80" height="4" rx="2" fill="#E5E7EB" />
  <rect x="60" y="85" width="60" height="4" rx="2" fill="#E5E7EB" />
  <rect x="60" y="100" width="70" height="4" rx="2" fill="#E5E7EB" />
  <rect x="60" y="115" width="50" height="4" rx="2" fill="#E5E7EB" />
  <rect x="60" y="130" width="65" height="4" rx="2" fill="#E5E7EB" />
  <rect x="60" y="145" width="45" height="4" rx="2" fill="#E5E7EB" />
  
  <!-- Bookmark -->
  <rect x="140" y="30" width="12" height="30" fill="#F59E0B" />
  <polygon points="140,60 146,50 152,60" fill="#F59E0B" />
  
  <!-- Search icon -->
  <circle
    cx="130"
    cy="90"
    r="8"
    fill="none"
    stroke="#4F46E5"
    stroke-width="2"
  />
  <line x1="136" y1="136" x2="142" y2="142" stroke="#4F46E5" stroke-width="2" />
</svg>
